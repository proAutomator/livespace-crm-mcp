name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Dependency audit
        run: bun audit

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Run gitleaks (pinned, checksum-verified, redacted output)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Start server with synthetic credentials
        # High rate limits: this job tests protocol conformance, not the
        # limiter (the limiter has its own unit and HTTP tests).
        run: |
          LIVESPACE_SUBDOMAIN=synthetic-ci LIVESPACE_API_KEY=synthetic-ci-key \
          LIVESPACE_API_SECRET=synthetic-ci-secret \
          MCP_RATE_LIMIT_PER_MINUTE=100000 MCP_RATE_LIMIT_BURST=10000 \
          MCP_MAX_CONCURRENT_REQUESTS=64 MCP_MAX_QUEUED_REQUESTS=256 \
          bun run src/index.ts &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3020/health >/dev/null && exit 0
            sleep 0.5
          done
          echo "server did not become healthy" >&2
          exit 1
      - name: MCP conformance suite (baseline for unimplemented features)
        run: bunx --no-install conformance server --url http://127.0.0.1:3020/mcp --expected-failures ./conformance-baseline.yml
