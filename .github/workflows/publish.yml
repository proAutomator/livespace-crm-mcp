name: Publish npm and MCP Registry

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Check release identity
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Publish with npm trusted publishing and provenance
        run: npm publish --access public --provenance

  # A separate job so a Registry hiccup can be re-run alone ("Re-run failed
  # jobs") without trying to publish the same npm version twice. It runs only
  # after the approved publish job, so it needs no second approval.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # registry_1.8.1_checksums.txt; equals the GitHub release asset digest.
      MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Wait until npm serves the released version
        # The Registry validates the npm package, and npm needs a few minutes
        # after publishing before the new version resolves.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            if npm view "livespace-crm-mcp@${VERSION}" version >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo "npm did not serve livespace-crm-mcp@${VERSION} within 5 minutes" >&2
          exit 1
      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish server.json to the MCP Registry with GitHub OIDC
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
